[project]
name = "hasdata-duckduckgo-mcp"
version = "1.0.0"
description = "MCP server for DuckDuckGo search through HasData's hosted API. Ranked results, ads, AI answer and 37 regions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "duckduckgo", "ddg", "search", "serp", "model-context-protocol", "hasdata"]
# mcp is pinned below 2 because mcp-proxy 0.12.0 imports request_ctx, removed in the mcp 2.x SDK.
dependencies = ["mcp-proxy>=0.12.0", "mcp>=1.17,<2"]

[project.urls]
Homepage = "https://hasdata.com/apis/duckduckgo-serp-api"
Repository = "https://github.com/HasData/duckduckgo-mcp"

[project.scripts]
hasdata-duckduckgo-mcp = "hasdata_duckduckgo_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hasdata_duckduckgo_mcp"]
